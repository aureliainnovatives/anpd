<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome to ANPD Dashboard</h1>
    <p class="subtitle">Monitor and manage your license control system</p>
  </div>

  <div class="dashboard-stats">
    <mat-card class="stat-card pending">
      <div class="stat-icon">
        <mat-icon>hourglass_empty</mat-icon>
      </div>
      <div class="stat-content">
        <h2 class="stat-value">{{ pendingSystems }}</h2>
        <p class="stat-label">Pending Systems</p>
      </div>
    </mat-card>

    <mat-card class="stat-card active">
      <div class="stat-icon">
        <mat-icon>check_circle</mat-icon>
      </div>
      <div class="stat-content">
        <h2 class="stat-value">{{ activeLicenses }}</h2>
        <p class="stat-label">Active Licenses</p>
      </div>
    </mat-card>

    <mat-card class="stat-card expired">
      <div class="stat-icon">
        <mat-icon>warning</mat-icon>
      </div>
      <div class="stat-content">
        <h2 class="stat-value">{{ expiredLicenses }}</h2>
        <p class="stat-label">Expired Licenses</p>
      </div>
    </mat-card>
  </div>

  <div class="dashboard-actions">
    <button mat-raised-button color="primary" (click)="navigateToSystems()">
      <mat-icon>list</mat-icon>
      View Systems
    </button>
  </div>
</div>
