<div class="dashboard-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>License Control Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="dashboard-stats">
        <mat-card class="stat-card">
          <mat-card-title>{{ pendingSystems }}</mat-card-title>
          <mat-card-subtitle>Pending Systems</mat-card-subtitle>
        </mat-card>
        <mat-card class="stat-card">
          <mat-card-title>{{ activeLicenses }}</mat-card-title>
          <mat-card-subtitle>Active Licenses</mat-card-subtitle>
        </mat-card>
        <mat-card class="stat-card">
          <mat-card-title>{{ expiredLicenses }}</mat-card-title>
          <mat-card-subtitle>Expired Licenses</mat-card-subtitle>
        </mat-card>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="navigateToSystems()">
        View Systems
      </button>
    </mat-card-actions>
  </mat-card>
</div>
